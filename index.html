<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transformation">
<meta name="theme-color" content="#121417">
<title>Transformation System</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23121417'/%3E%3Crect x='24' y='78' width='132' height='24' rx='6' fill='%23EDEBE4'/%3E%3Crect x='30' y='60' width='22' height='60' rx='7' fill='%23E23A2E'/%3E%3Crect x='128' y='60' width='22' height='60' rx='7' fill='%23E23A2E'/%3E%3Crect x='12' y='70' width='14' height='40' rx='5' fill='%232B6CD4'/%3E%3Crect x='154' y='70' width='14' height='40' rx='5' fill='%232B6CD4'/%3E%3C/svg%3E">
<style>
html{color-scheme:dark}
:root{
  --bg:#121417; --bgT:var(--bgT); --surface:#1A1D22; --surface2:#22262D; --line:#2F343C;
  --chalk:#EDEBE4; --inv:#14171B; --body:#C9CCD1; --muted:#8B939D; --dim:#5D656F;
  --red:#E23A2E; --blue:#2B6CD4; --yellow:#F2B705; --green:#27A567;
  --redtext:#FF9D94; --bluetext:#8FB4F5; --greentext:#7AE2AB;
  --readybg:#123524; --inpfocus:#1B2230; --overlay:rgba(8,9,11,.72);
  --ghost:rgba(255,255,255,.06); --ghostline:rgba(255,255,255,.14);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  html:not([data-theme="dark"]){color-scheme:light}
  :root:not([data-theme="dark"]){
    --bg:#ECEEF0; --bgT:rgba(236,238,240,0); --surface:#FFFFFF; --surface2:#E4E7EB; --line:#D6DADF;
    --chalk:#161A1E; --inv:#FFFFFF; --body:#3B4148; --muted:#5C646D; --dim:#939BA4;
    --red:#C92A1D; --blue:#1E56AE; --yellow:#C98A00; --green:#12844E;
    --redtext:#A81F14; --bluetext:#164A9B; --greentext:#0C6C3F;
    --readybg:#D6F0E1; --inpfocus:#EAF1FC; --overlay:rgba(30,34,38,.45);
    --ghost:rgba(0,0,0,.05); --ghostline:rgba(0,0,0,.12);
  }
}
html[data-theme="light"]{color-scheme:light}
:root[data-theme="light"]{
  --bg:#ECEEF0; --bgT:rgba(236,238,240,0); --surface:#FFFFFF; --surface2:#E4E7EB; --line:#D6DADF;
  --chalk:#161A1E; --inv:#FFFFFF; --body:#3B4148; --muted:#5C646D; --dim:#939BA4;
  --red:#C92A1D; --blue:#1E56AE; --yellow:#C98A00; --green:#12844E;
  --redtext:#A81F14; --bluetext:#164A9B; --greentext:#0C6C3F;
  --readybg:#D6F0E1; --inpfocus:#EAF1FC; --overlay:rgba(30,34,38,.45);
  --ghost:rgba(0,0,0,.05); --ghostline:rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--chalk);font-family:var(--sans)}
body{font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

#app{min-height:100vh;min-height:100dvh}
.screen{padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 24px);max-width:620px;margin:0 auto}
.screen.hasbar,body.resting .screen{padding-bottom:calc(var(--safeB) + 118px)}

/* ---------- home ---------- */
.kicker{color:var(--muted);font-size:13px;margin:0 0 2px}
.brand{font-size:13px;color:var(--dim);letter-spacing:.01em;margin-bottom:18px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(20,25,30,.05);padding:18px 18px 16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.hero .wk{display:flex;align-items:baseline;gap:10px}
.hero .wknum{font-size:54px;font-weight:700;line-height:.95;font-family:var(--mono)}
.hero .wklab{color:var(--muted);font-size:14px}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:14px 0 2px;line-height:1.1}
.hero .focus{color:var(--muted);font-size:15px;margin:0}
.hero .stats{margin-top:14px;color:var(--muted);font-size:14px}
.hero .stats b{color:var(--chalk);font-weight:600;font-family:var(--mono)}

.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:14px;font-weight:650;font-size:17px}
.btn.primary{background:var(--red);color:#fff;margin-top:16px}
.pickgrid button.on{color:#fff}
.btn.primary:active{background:#c22f24}
.btn.ghost{border:1px solid var(--line);background:var(--surface);color:var(--chalk)}
.btn.ghost:active{background:var(--surface2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row2 .btn{padding:13px;font-size:15px;font-weight:600}

.sect{margin-top:28px}
.sect h2{font-size:15px;font-weight:650;margin:0 0 10px;color:var(--chalk)}
.sect h2 span{color:var(--dim);font-weight:400}

/* program grid */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px}
.gcols{display:grid;grid-template-columns:26px repeat(5,1fr);gap:5px;align-items:center}
.ghead{font-size:10px;color:var(--dim);text-align:center;padding-bottom:2px}
.grow{font-size:11px;color:var(--dim);font-family:var(--mono);text-align:right;padding-right:2px}
.cell{aspect-ratio:1/1;border-radius:7px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);font-family:var(--mono);min-height:26px}
.cell.done{background:var(--green);border-color:var(--green);color:#fff}
.cell.part{background:rgba(242,183,5,.18);border-color:var(--yellow);color:var(--yellow)}
.cell.skip{background:var(--surface2);border-color:var(--surface2);color:var(--dim)}
.cell.now{border-color:var(--red);border-width:2px;color:var(--chalk);background:rgba(226,58,46,.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* preview list */
.plist{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.pitem{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.pitem:last-child{border-bottom:none}
.pitem .pn{font-family:var(--mono);font-size:12px;color:var(--dim);width:14px;flex:none}
.pitem .pname{flex:1;font-size:15px}
.pitem .pmeta{font-size:12px;color:var(--muted);font-family:var(--mono);flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(226,58,46,.15);color:var(--redtext);margin-left:6px;vertical-align:1px}

/* ---------- workout ---------- */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,var(--bgT));padding:calc(var(--safeT) + 10px) 16px 8px;max-width:620px;margin:0 auto}
.topline{display:flex;align-items:center;gap:12px}
.xbtn{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);flex:none}
.topline .tt{flex:1;min-width:0}
.topline .tt .d{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topline .tt .s{font-size:12px;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 16px 2px;max-width:620px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.chip.cur{border-color:var(--chalk);color:var(--chalk);background:var(--surface2)}
.chip.done{border-color:transparent;background:rgba(39,165,103,.16);color:var(--greentext)}
.chip.later{border-style:dashed;color:var(--dim)}

.excard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.exhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.exname{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.exidx{font-family:var(--mono);font-size:13px;color:var(--dim);flex:none;padding-top:5px}
.exmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.pill b{color:var(--chalk);font-family:var(--mono);font-weight:600}
.pill.fail{background:rgba(226,58,46,.15);color:var(--redtext)}

details.info{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.info+details.info{border-top:none;padding-top:0}
details.info summary{list-style:none;font-size:14px;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px}
details.info summary::-webkit-details-marker{display:none}
details.info summary:before{content:"›";display:inline-block;transition:transform .15s;color:var(--dim)}
details.info[open] summary:before{transform:rotate(90deg)}
details.info .body{font-size:14.5px;color:var(--body);line-height:1.5;padding:2px 0 8px}
.subrow{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}
.subbtn{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px;color:var(--chalk);background:var(--surface2)}
.subbtn.active{border-color:var(--blue);color:var(--bluetext)}

.setgroup{margin-top:16px}
.setlabel{font-size:12px;color:var(--dim);margin:0 0 7px;display:flex;justify-content:space-between;align-items:center}
.stepper{display:flex;gap:6px;align-items:center}
.useg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.useg button{padding:4px 11px;font-size:12.5px;color:var(--muted);background:transparent;line-height:1.5}
.useg button.on{background:var(--chalk);color:var(--inv);font-weight:600}
.stepper button{width:24px;height:24px;border-radius:7px;background:var(--surface2);color:var(--muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

.setrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(47,52,60,.6)}
.setrow:last-child{border-bottom:none}
.tick{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--mono);color:var(--muted);background:transparent}
.tick.wu{border-color:rgba(43,108,212,.55);color:var(--bluetext)}
.tick.last{border-color:rgba(226,58,46,.6);color:var(--redtext)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.tick:active{transform:scale(.94)}
.setinfo{flex:1;min-width:0}
.setinfo .t1{font-size:13.5px;line-height:1.3}
.setinfo .t2{font-size:12px;color:var(--dim)}
.inputs{display:flex;gap:6px;flex:none}
.inp{width:60px;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 8px;color:var(--chalk);font-size:16px;text-align:center;font-family:var(--mono)}
.inp:focus{outline:none;border-color:var(--blue);background:var(--inpfocus)}
.inp::placeholder{color:var(--dim)}
.inpwrap{position:relative}
.inpwrap span{position:absolute;right:6px;bottom:2px;font-size:9px;color:var(--dim);pointer-events:none}

.lastnote{margin-top:10px;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:9px 11px}
.lastnote b{color:var(--chalk);font-family:var(--mono);font-weight:500}

.exfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.exfoot .btn{padding:13px;font-size:15px}
.donebanner{margin-top:14px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- rest bar ---------- */
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface2);border-top:1px solid var(--line);padding:12px 16px calc(var(--safeB) + 12px);transform:translateY(120%);transition:transform .22s ease}
.restbar.show{transform:none}
.restbar .inner{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.restbar .time{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;min-width:104px;letter-spacing:-.03em}
.restbar .lab{flex:1;font-size:13px;color:var(--muted);line-height:1.3}
.restbar button{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;flex:none}
.restbar.ready{background:var(--readybg);border-top-color:var(--green)}
.restbar.ready .lab{color:var(--chalk);opacity:.8}
.restbar.ready .time{color:var(--greentext)}
.restbar.ready button{background:var(--ghost);border-color:var(--ghostline)}
.bar{position:absolute;left:0;top:0;height:2px;background:var(--yellow);transition:width .3s linear}
.restbar.ready .bar{background:var(--green)}

/* ---------- misc ---------- */
.finish{text-align:center;padding-top:40px}
.finish .big{font-size:64px;line-height:1}
.finish h1{font-size:28px;margin:14px 0 6px}
.finish p{color:var(--muted);margin:0 0 6px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:24px 0}
.sumgrid div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.sumgrid .v{font-family:var(--mono);font-size:24px;font-weight:600}
.sumgrid .k{font-size:11px;color:var(--muted);margin-top:2px}

.setlist{list-style:none;padding:0;margin:0}
/* history */
.hhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hhead h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:left;display:block}
.hcard .hl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hcard .hn{font-size:17px;font-weight:650}
.hcard .hw{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
.hcard .hm{font-size:13px;color:var(--muted);margin-top:5px}
.hcard .hm b{color:var(--chalk);font-family:var(--mono);font-weight:500}
.hcard.miss{opacity:.55}
.hex{border-bottom:1px solid var(--line);padding:13px 0}
.hex:last-child{border-bottom:none}
.hex .hxn{font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hex .hxn small{font-size:12px;color:var(--dim);font-weight:400;flex:none}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sbox{background:var(--surface2);border-radius:9px;padding:6px 9px;font-size:13px;font-family:var(--mono)}
.sbox.wu{background:transparent;border:1px solid var(--line);color:var(--dim)}
.sbox.best{background:rgba(39,165,103,.18);color:var(--greentext)}
.sbox i{font-style:normal;color:var(--dim);font-size:11px}
.hempty{color:var(--dim);font-size:13px;margin-top:6px}
.prow{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .pw{font-family:var(--mono);font-size:12px;color:var(--dim);width:52px;flex:none}
.trendbar{height:26px;display:flex;align-items:flex-end;gap:3px;margin:14px 0 4px}
.trendbar i{flex:1;background:var(--surface2);border-radius:2px;min-height:3px}
.trendbar i.top{background:var(--green)}
.gwu li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(47,52,60,.6);font-size:15px}
.gwu li:last-child{border-bottom:none}
.gwu .rep{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}

.modal{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:18px 16px calc(var(--safeB) + 18px);max-height:86vh;overflow:auto;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.optrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.optrow:last-of-type{border-bottom:none}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface2);position:relative;flex:none;border:1px solid var(--line)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.16s}
.switch.on{background:rgba(39,165,103,.3);border-color:var(--green)}
.switch.on i{left:25px;background:var(--green)}
.seg{display:flex;gap:6px}
.seg button{padding:7px 13px;border-radius:9px;background:var(--surface2);font-size:14px;color:var(--muted)}
.seg button.on{background:var(--chalk);color:var(--inv);font-weight:600}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0 18px}
.pickgrid button{padding:11px 0;border-radius:10px;background:var(--surface2);font-family:var(--mono);font-size:15px}
.pickgrid button.on{background:var(--red);color:#fff}
.tiny{font-size:12.5px;color:var(--dim);line-height:1.5}
a{color:var(--bluetext)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="restbar" id="restbar"><div class="bar" id="restprog"></div><div class="inner">
  <div class="time num" id="resttime">0:00</div>
  <div class="lab" id="restlab"></div>
  <button id="restadd">+30s</button>
  <button id="restskip">Done</button>
</div></div>
<div id="modalhost"></div>

/* ===================== storage ===================== */
const KEY='bts.v1';
const mem={};
const store={
  get(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return mem[KEY]||null; } },
  set(v){ const s=JSON.stringify(v); try{ localStorage.setItem(KEY,s); }catch(e){ mem[KEY]=JSON.parse(s); } }
};
const defaults={week:1,day:1,log:{},unit:'kg',beep:true,wuTimer:true,restHigh:false,round:2.5,roundLb:5,theme:'auto',exUnit:{},dataV:2};
const stored=store.get();
let S=Object.assign({},defaults,stored||{});
// every set logged before per exercise units gets stamped with the unit it was entered in
(function migrate(){
  if(!stored||stored.dataV>=2) return;
  const u=S.unit||'kg';
  Object.keys(S.log||{}).forEach(k=>{ const L=S.log[k]; if(!L||!L.ex)return;
    Object.keys(L.ex).forEach(i=>{ const e=L.ex[i]; if(!e||!e.sets)return;
      Object.keys(e.sets).forEach(sk=>{ if(!e.sets[sk].unit) e.sets[sk].unit=u; }); }); });
  S.dataV=2;
})();
function save(){ store.set(S); }

function prefersDark(){ try{ return window.matchMedia('(prefers-color-scheme:dark)').matches; }catch(e){ return true; } }
function applyTheme(){
  try{
    document.documentElement.setAttribute('data-theme',S.theme||'auto');
    const dark=(S.theme==='dark')||((S.theme||'auto')==='auto'&&prefersDark());
    const m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',dark?'#121417':'#ECEEF0');
  }catch(e){}
}
try{ window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme); }catch(e){}

/* ===================== helpers ===================== */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=(w,d)=>'w'+w+'d'+d;
const weekDays=w=>PROGRAM.filter(x=>x.w===w);
function dayAt(w,d){ return weekDays(w)[d-1]; }
function splitName(n){ const m=n.match(/^(.*?)\s*\((.*)\)\s*$/); return m?[m[1],m[2].replace('Focus','focus')]:[n,'']; }
function parseRest(s){ const m=String(s).match(/(\d+)\s*-\s*(\d+)/); if(m)return [(+m[1])*60,(+m[2])*60]; const n=String(s).match(/(\d+)/); return n?[(+n[1])*60,(+n[1])*60]:[90,120]; }
function rangeLow(s){ const m=String(s).match(/(\d+)/); return m?+m[1]:1; }
function rangeHigh(s){ const m=String(s).match(/(\d+)\s*-\s*(\d+)/); return m?+m[2]:rangeLow(s); }
const WUP={1:[[60,'6-10']],2:[[50,'6-10'],[70,'4-6']],3:[[45,'6-10'],[65,'4-6'],[85,'3-4']],4:[[45,'6-10'],[60,'4-6'],[75,'3-5'],[85,'2-4']]};
function exUnitOf(name){ return (S.exUnit&&S.exUnit[name])||S.unit; }
function setExUnit(name,u){
  S.exUnit=S.exUnit||{}; S.exUnit[name]=u;
  const L=S.log[key(S.week,S.day)], day=dayAt(S.week,S.day);
  if(L&&day) day.e.forEach((ex,i)=>{ if(ex.n===name&&L.ex[i]) Object.keys(L.ex[i].sets).forEach(k=>{ L.ex[i].sets[k].unit=u; }); });
  save(); render();
}
const LB=2.2046226218;
function conv(v,from,to){ v=parseFloat(v)||0; if(!from||!to||from===to)return v; return from==='kg'?v*LB:v/LB; }
function setUnit(r){ return (r&&r.unit)||S.unit; }
function roundW(x,u){ const r=(u==='lb')?(S.roundLb||5):S.round; return Math.round(x/r)*r; }
function fmtT(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function dayLog(w,d,make){
  const k=key(w,d);
  if(!S.log[k]&&make){ S.log[k]={status:'open',started:Date.now(),ex:{},order:null,gwu:{}}; }
  return S.log[k];
}
function exState(L,i,ex){
  if(!L.ex[i]) L.ex[i]={sets:{},wu:rangeLow(ex.wu),ws:ex.ws,later:false,sub:0};
  return L.ex[i];
}
function exDone(L,i,ex){ const e=L.ex[i]; if(!e)return false; for(let s=0;s<e.ws;s++){ if(!(e.sets['w'+s]&&e.sets['w'+s].done)) return false; } return true; }
function dayStats(w,d){
  const L=S.log[key(w,d)]; const day=dayAt(w,d); if(!L||!day) return {done:0,total:day?day.e.length:0,sets:0};
  let done=0,sets=0;
  day.e.forEach((ex,i)=>{ if(exDone(L,i,ex))done++; const e=L.ex[i]; if(e)Object.keys(e.sets).forEach(k=>{if(e.sets[k].done)sets++;}); });
  return {done,total:day.e.length,sets};
}
function lastTime(name,beforeW,beforeD){
  let best=null,bestRank=-1;
  Object.keys(S.log).forEach(k=>{
    const m=k.match(/w(\d+)d(\d+)/); if(!m)return;
    const w=+m[1],d=+m[2],rank=w*10+d;
    if(rank>=beforeW*10+beforeD||rank<=bestRank) return;
    const day=dayAt(w,d); if(!day) return;
    day.e.forEach((ex,i)=>{
      if(ex.n!==name) return;
      const e=S.log[k].ex&&S.log[k].ex[i]; if(!e) return;
      const rows=[];
      for(let s2=0;s2<(e.ws||0);s2++){ const r=e.sets['w'+s2]; if(r&&r.done&&(r.weight||r.reps)) rows.push({weight:r.weight||'',reps:r.reps||''}); }
      if(rows.length){ bestRank=rank; best={w,d,rows}; }
    });
  });
  return best;
}
function ltText(lt){ return lt.rows.map(r=>(r.weight||'?')+setUnit(r)+' x '+(r.reps||'?')).join(',  '); }

let AC=null;
function unlockAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); const b=AC.createBuffer(1,1,22050); const s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);}catch(e){} }
function beep(n){ if(!S.beep||!AC)return; try{ AC.resume(); for(let i=0;i<(n||1);i++){ const o=AC.createOscillator(),g=AC.createGain(); o.connect(g); g.connect(AC.destination); o.type='sine'; o.frequency.value=780; const t=AC.currentTime+i*0.22; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2);} }catch(e){} }

/* ===================== wake lock ===================== */
let wl=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock'in navigator){ if(!wl) wl=await navigator.wakeLock.request('screen'); }
    else if(wl){ wl.release(); wl=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(view==='workout')keepAwake(true); tickRest(); } });

let rest=null, restInt=null, firedLow=false, firedHigh=false;
function startRest(low,high,label){
  rest={start:Date.now(),low:low,high:high,label:label||''};
  firedLow=false; firedHigh=false;
  $('#restbar').classList.add('show'); document.body.classList.add('resting');
  if(restInt)clearInterval(restInt);
  restInt=setInterval(tickRest,250); tickRest();
}
function stopRest(){ rest=null; if(restInt)clearInterval(restInt); restInt=null; const b=$('#restbar'); b.classList.remove('show'); b.classList.remove('ready'); document.body.classList.remove('resting'); }
function tickRest(){
  if(!rest)return;
  const el=Math.floor((Date.now()-rest.start)/1000);
  const left=rest.low-el;
  const b=$('#restbar');
  if(left>0){
    $('#resttime').textContent=fmtT(left);
    $('#restlab').innerHTML='Rest until '+fmtT(rest.low)+(rest.high!==rest.low?' to '+fmtT(rest.high):'')+(rest.label?'<br>'+esc(rest.label):'');
    $('#restprog').style.width=(100*el/rest.low)+'%';
    b.classList.remove('ready');
  }else{
    if(!firedLow){ firedLow=true; beep(2); }
    b.classList.add('ready');
    $('#resttime').textContent='+'+fmtT(-left);
    $('#restlab').innerHTML=(el<rest.high?'Ready. Ideal window ends at '+fmtT(rest.high):'Rest is long, get going')+(rest.label?'<br>'+esc(rest.label):'');
    $('#restprog').style.width='100%';
    if(el>=rest.high&&!firedHigh){ firedHigh=true; beep(3); }
    if(el>rest.high+600) stopRest();
  }
}
$('#restadd').onclick=()=>{ if(rest){ rest.low+=30; rest.high+=30; firedLow=false; firedHigh=false; tickRest(); } };
$('#restskip').onclick=()=>stopRest();

/* ===================== routing ===================== */
let view='home', cur=0;
function render(){
  const app=$('#app');
  app.scrollTop=0;
  if(view==='home') app.innerHTML=homeHTML();
  else if(view==='workout'){ app.innerHTML=workoutHTML(); afterWorkout(); }
  else if(view==='finish') app.innerHTML=finishHTML();
  else if(view==='history') app.innerHTML=historyHTML();
  else if(view==='session') app.innerHTML=sessionHTML();
  else if(view==='exhist') app.innerHTML=exHistHTML();
  window.scrollTo(0,0);
}

/* ===================== home ===================== */
function homeHTML(){
  const w=S.week,d=S.day;
  const day=dayAt(w,d);
  if(!day) return `<div class="screen finish"><div class="big">🏁</div><h1>Program complete</h1><p>All 12 weeks are logged.</p><button class="btn ghost" style="margin-top:20px" onclick="openHistory()">See your history</button><button class="btn ghost" style="margin-top:10px" onclick="openSettings()">Settings and backup</button></div>`;

  const workSets=day.e.reduce((a,e)=>a+e.ws,0);
  const mins=Math.round(day.e.reduce((a,e)=>a+e.ws*(parseRest(e.rt)[0]/60+1),0)+8);
  return `<div class="screen">
    <div class="brand">Bodybuilding Transformation System</div>
    <div class="hero">
      <p class="kicker">${esc(day.b)} block</p>
      <div class="wk"><div class="wknum">${w}</div><div class="wklab">of 12 weeks<br>day ${d} of 5</div></div>
      <h1>${esc(nm)}</h1>
      <p class="focus">${esc(focus||'Training day')}</p>
      <div class="stats"><b>${day.e.length}</b> exercises, <b>${workSets}</b> working sets, about <b>${mins}</b> min</div>
      <button class="btn primary" onclick="startWorkout()">${st.sets?'Continue workout':'Start workout'}</button>
      <div class="row2">
        <button class="btn ghost" onclick="skipDay()">Skip this day</button>
        <button class="btn ghost" onclick="openJump()">Change day</button>
      </div>
    </div>

    <div class="sect">
      <h2>Today <span>tap any exercise to start there</span></h2>
      <div class="plist">${day.e.map((e,i)=>`
        <div class="pitem" onclick="startWorkout(${i})">
          <div class="pn">${i+1}</div>
          <div class="pname">${esc(e.n)}${e.t?`<span class="tag">${esc(e.t.split(' ')[0])}</span>`:''}</div>
          <div class="pmeta">${e.ws} x ${esc(e.r)}</div>
        </div>`).join('')}</div>
    </div>

    <div class="sect">
      <h2>Progress</h2>
      <div class="gridwrap">
        <div class="gcols">
          <div></div>${['1','2','3','4','5'].map(x=>`<div class="ghead">d${x}</div>`).join('')}
          ${Array.from({length:12},(_,wi)=>{
            const ww=wi+1;
            return `<div class="grow">w${ww}</div>`+Array.from({length:5},(_,di)=>{
              const dd=di+1, L=S.log[key(ww,dd)];
              let cls='cell';
              if(L&&L.status==='done')cls+=' done';
              else if(L&&L.status==='skipped')cls+=' skip';
              else if(L&&L.status==='open')cls+=' part';
              if(ww===w&&dd===d)cls+=' now';
              const lab=L&&L.status==='done'?'✓':(L&&L.status==='skipped'?'–':'');
              return `<button class="${cls}" onclick="jumpTo(${ww},${dd})">${lab}</button>`;
            }).join('');
          }).join('')}
        </div>
        <div class="legend">
          <span><i style="background:var(--green)"></i>done</span>
          <span><i style="background:rgba(242,183,5,.5)"></i>started</span>
          <span><i style="background:var(--surface2)"></i>skipped</span>
          <span><i style="border:2px solid var(--red);width:7px;height:7px"></i>today</span>
        </div>
      </div>
      <div class="row2" style="margin-top:12px">

function jumpTo(w,d){ S.week=w; S.day=d; save(); view='home'; render(); }
function skipDay(){
  if(!confirm('Skip '+dayAt(S.week,S.day).d+' and move to the next day?'))return;
  const L=dayLog(S.week,S.day,true); L.status='skipped'; L.skippedAt=Date.now();
  advance(); save(); render();
}
function advance(){
  if(S.day<5){ S.day++; } else if(S.week<12){ S.week++; S.day=1; } else { S.day=6; }
  save();
}
function startWorkout(i){
  unlockAudio(); keepAwake(true);
  const L=dayLog(S.week,S.day,true);
  if(L.status==='skipped')L.status='open';
  const day=dayAt(S.week,S.day);
  cur=(typeof i==='number')?i:firstUndone(L,day);
  view='workout'; save(); render();
}
function firstUndone(L,day){
  const order=visOrder(L,day);
  for(const i of order){ if(!exDone(L,i,day.e[i])&&!(L.ex[i]&&L.ex[i].later)) return i; }
  for(const i of order){ if(!exDone(L,i,day.e[i])) return i; }
  return order[0];
}
function visOrder(L,day){
  const base=day.e.map((_,i)=>i);
  const later=base.filter(i=>L.ex[i]&&L.ex[i].later&&!exDone(L,i,day.e[i]));
  const rest=base.filter(i=>later.indexOf(i)<0);
  return rest.concat(later);
}

/* ===================== workout ===================== */
function workoutHTML(){
  const w=S.week,d=S.day,day=dayAt(w,d),L=dayLog(w,d,true);
  const [nm]=splitName(day.d);
  const st=dayStats(w,d);
  if(cur==null||cur<0||cur>=day.e.length) cur=0;
  const ex=day.e[cur], E=exState(L,cur,ex);
  const [restLow,restHigh]=parseRest(ex.rt);
  const wuN=E.wu, wsN=E.ws;
  const wuPlan=WUP[Math.min(4,Math.max(1,wuN))]||[];
  const base=parseFloat((E.sets['w0']&&E.sets['w0'].weight)||'')||null;
  const lt=lastTime(ex.n,w,d);
  const ltBase=(!base&&lt&&lt.rows.length)?(parseFloat(lt.rows[0].weight)||null):null;
  const refW=base||ltBase;
  const names=[ex.n,ex.s1,ex.s2].filter(Boolean);
  const shownName=names[E.sub]||ex.n;
  const U=exUnitOf(ex.n);
  const refU=base?U:(lt&&lt.rows[0]?setUnit(lt.rows[0]):U);

  const chips=visOrder(L,day).map(i=>{
    const e2=day.e[i]; let c='chip';
    if(i===cur)c+=' cur'; else if(exDone(L,i,e2))c+=' done'; else if(L.ex[i]&&L.ex[i].later)c+=' later';
    return `<button class="${c}" onclick="goEx(${i})">${esc(e2.n)}</button>`;
  }).join('');

  const gwuDone=Object.keys(L.gwu||{}).length>=6;
  const gwuCard=(!L.gwuSkipped&&!gwuDone&&st.sets===0)?generalWarmup(L):'';

  const wuRows=wuN>0?`<div class="setgroup">
    <p class="setlabel"><span>Warm up sets${refW?' from '+roundW(conv(refW,refU,U),U)+U:''}</span>
      <span class="stepper"><button onclick="setWU(-1)">−</button><span class="num">${wuN}</span><button onclick="setWU(1)">+</button></span></p>
    ${wuPlan.map((p,i)=>{
      const r=E.sets['wu'+i]||{};
      const wgt=refW?roundW(conv(refW,refU,U)*p[0]/100,U):null;
      return `<div class="setrow">
        <button class="tick wu ${r.done?'on':''}" onclick="tickSet('wu${i}',${restLow>200?90:60},${restLow>200?120:90})">${r.done?'✓':'w'+(i+1)}</button>
        <div class="setinfo"><div class="t1">${wgt?('<span class="num">'+wgt+'</span> '+U):(p[0]+'% of working weight')}</div>
        <div class="t2">${p[0]}% for ${p[1]} reps</div></div>
      </div>`;}).join('')}
  </div>`:'';

  const wsRows=`<div class="setgroup">
    <p class="setlabel"><span>Working sets</span>
      <span style="display:flex;gap:12px;align-items:center">
        <span class="useg"><button class="${U==='kg'?'on':''}" onclick="setExUnit('${esc(ex.n).replace(/'/g,"\\'")}','kg')">kg</button><button class="${U==='lb'?'on':''}" onclick="setExUnit('${esc(ex.n).replace(/'/g,"\\'")}','lb')">lb</button></span>
        <span class="stepper"><button onclick="setWS(-1)">−</button><span class="num">${wsN}</span><button onclick="setWS(1)">+</button></span></span></p>
    ${Array.from({length:wsN},(_,i)=>{
      const r=E.sets['w'+i]||{};
      const last=i===wsN-1;
      const rpe=last?ex.e2:(ex.e1==='N/A'?ex.e2:ex.e1);
      return `<div class="setrow">
        <button class="tick ${last?'last':''} ${r.done?'on':''}" onclick="tickSet('w${i}',${restLow},${restHigh})">${r.done?'✓':(i+1)}</button>
        <div class="setinfo"><div class="t1">${esc(ex.r)} reps <span style="color:var(--dim)">at RPE ${esc(String(rpe).replace('~',''))}</span></div>
        <div class="t2">${last?(ex.t?esc(ex.t):'Last set, take it to failure'):'Leave a rep or two in the tank'}</div></div>
        <div class="inputs">
          <div class="inpwrap"><input class="inp" inputmode="decimal" placeholder="${lt&&(lt.rows[i]||lt.rows[0])?esc((lt.rows[i]||lt.rows[0]).weight):'0'}" value="${esc(r.weight||'')}" oninput="setField('w${i}','weight',this.value)"><span>${(r.unit||U)}</span></div>
          <div class="inpwrap"><input class="inp" inputmode="numeric" placeholder="${lt&&(lt.rows[i]||lt.rows[0])?esc((lt.rows[i]||lt.rows[0]).reps):'0'}" value="${esc(r.reps||'')}" oninput="setField('w${i}','reps',this.value)"><span>reps</span></div>
        </div>
      </div>`;}).join('')}
  </div>`;

  const allDone=day.e.every((e,i)=>exDone(L,i,e)||(L.ex[i]&&L.ex[i].skipped));
  return `<div class="topbar"><div class="topline">
      <button class="xbtn" onclick="leave()">✕</button>
      <div class="tt"><div class="d">${esc(nm)}</div><div class="s">week ${w}, day ${d} &nbsp;·&nbsp; ${st.done}/${st.total} exercises</div></div>
      <button class="xbtn" onclick="openSettings()">⚙</button>
    </div></div>
    <div class="chips">${chips}</div>
    <div class="screen hasbar">
      ${gwuCard}
      <div class="excard">
        <div class="exhead"><h2 class="exname">${esc(shownName)}</h2><div class="exidx">${cur+1}/${day.e.length}</div></div>
        <div class="exmeta">
          <span class="pill"><b>${wsN}</b> x <b>${esc(ex.r)}</b> reps</span>
          <span class="pill">rest <b>${esc(ex.rt.replace(' min',''))}</b> min</span>
          ${ex.t?`<span class="pill fail">${esc(ex.t)}</span>`:''}
        </div>
        ${ex.no?`<details class="info"><summary>Technique notes</summary><div class="body">${esc(ex.no)}</div></details>`:''}
        ${(ex.s1||ex.s2)?`<details class="info"><summary>Swap this exercise</summary><div class="subrow">
          ${names.map((n,i)=>`<button class="subbtn ${E.sub===i?'active':''}" onclick="setSub(${i})">${esc(n)}</button>`).join('')}
        </div></details>`:''}
        ${lt?`<button class="lastnote" style="display:block;width:100%;text-align:left" onclick="openExHist('${esc(ex.n).replace(/'/g,"\\'")}','workout')">Last time, week ${lt.w} day ${lt.d}: <b>${esc(ltText(lt))}</b><br><span style="color:var(--dim);font-size:12px">See every session of this lift</span></button>`:''}
        ${wuRows}
        ${wsRows}
        ${(()=>{ const done=exDone(L,cur,ex); const nx=nextUndone();
          if(done&&nx!=null&&nx!==cur) return `<button class="btn primary" style="margin-top:16px" onclick="goEx(${nx})">Next: ${esc(day.e[nx].n)}</button>`;
          if(done) return '<div class="donebanner" style="margin-top:16px">All sets logged for this one</div>';
          return `<div class="exfoot">
            <button class="btn ghost" onclick="doLater()">Do this later</button>
            <button class="btn ghost" onclick="nextEx()">Skip to next</button>
          </div>`; })()}
      </div>
      ${allDone?`<button class="btn primary" onclick="finishDay()">Finish this workout</button>`:`<div class="donebanner">${st.done} of ${st.total} exercises done</div>`}
    </div>`;
}

function generalWarmup(L){
  const items=[['5-10 min','Light cardio, your choice of machine'],['10 per side','Arm swings'],['10 per side','Arm circles'],['10 per side','Front to back leg swings'],['10 per side','Side to side leg swings'],['15 per side','Cable external rotation, optional']];
  return `<div class="excard"><div class="exhead"><h2 class="exname">General warm up</h2></div>
    <p style="color:var(--muted);font-size:14px;margin:8px 0 2px">Five to ten minutes before you touch a working set.</p>
    <ul class="setlist gwu">${items.map((it,i)=>`<li>
      <button class="tick ${L.gwu&&L.gwu[i]?'on':''}" style="width:34px;height:34px;border-radius:10px" onclick="tickGWU(${i})">${L.gwu&&L.gwu[i]?'✓':''}</button>
      <span style="flex:1">${esc(it[1])}</span><span class="rep">${esc(it[0])}</span></li>`).join('')}</ul>
    <button class="btn ghost" style="margin-top:14px;padding:11px;font-size:14px" onclick="skipGWU()">Warm up done, hide this</button></div>`;
}

function afterWorkout(){
  const c=$('.chips .chip.cur'); if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'});
}
function L_(){ return dayLog(S.week,S.day,true); }
function E_(){ const day=dayAt(S.week,S.day); return exState(L_(),cur,day.e[cur]); }

function tickGWU(i){ const L=L_(); L.gwu=L.gwu||{}; if(L.gwu[i])delete L.gwu[i]; else L.gwu[i]=1; save(); render(); }
function skipGWU(){ const L=L_(); L.gwuSkipped=true; save(); render(); }
function setWU(n){ const E=E_(); E.wu=Math.max(0,Math.min(4,E.wu+n)); save(); render(); }
function setWS(n){ const E=E_(); E.ws=Math.max(1,Math.min(8,E.ws+n)); save(); render(); }
function setSub(i){ const E=E_(); E.sub=i; save(); render(); }
function setField(k,f,v){ const E=E_(), day=dayAt(S.week,S.day);
  E.sets[k]=E.sets[k]||{}; E.sets[k][f]=v;
  if(!E.sets[k].unit) E.sets[k].unit=exUnitOf(day.e[cur].n);
  save(); }
function tickSet(k,low,high){
  unlockAudio();
  const E=E_(), day=dayAt(S.week,S.day), ex=day.e[cur];
  E.sets[k]=E.sets[k]||{};
  const now=!E.sets[k].done;
  E.sets[k].done=now; E.sets[k].ts=Date.now();
  if(!E.sets[k].unit) E.sets[k].unit=exUnitOf(ex.n);
  if(now)E.later=false;
  save();
  if(now){
    const isWU=k.indexOf('wu')===0;
    if(!isWU||S.wuTimer) startRest(low,high,ex.n);
  }
  render();
}
function nextUndone(){
  const day=dayAt(S.week,S.day),L=L_();
  const order=visOrder(L,day);
  const pos=order.indexOf(cur);
  for(let j=1;j<=order.length;j++){ const i=order[(pos+j)%order.length]; if(!exDone(L,i,day.e[i])) return i; }
  return null;
}
function goEx(i){ cur=i; render(); }
function nextEx(){ const n=nextUndone(); if(n!=null)cur=n; render(); }
function doLater(){
  const E=E_(); E.later=true; save();
  const n=nextUndone(); if(n!=null&&n!==cur)cur=n;
  render();
}
function leave(){ keepAwake(false); view='home'; render(); }
function finishDay(){
  const L=L_(); L.status='done'; L.finished=Date.now();
  stopRest(); keepAwake(false); save();
  view='finish'; render();
}

/* ===================== finish ===================== */
function finishHTML(){
  const w=S.week,d=S.day,L=S.log[key(w,d)],day=dayAt(w,d);
  const st=dayStats(w,d);
  let vol=0,cnt=0;
  day.e.forEach((ex,i)=>{ const e=L.ex[i]; if(!e)return; Object.keys(e.sets).forEach(k=>{ const r=e.sets[k]; if(r.done&&k[0]==='w'&&k[1]!=='u'){ cnt++; if(r.weight&&r.reps)vol+=conv(r.weight,setUnit(r),S.unit)*parseFloat(r.reps); } }); });
  let first=null;
  day.e.forEach((ex,i)=>{ const e=L.ex[i]; if(!e)return; Object.keys(e.sets).forEach(k=>{ const t=e.sets[k].ts; if(t&&(!first||t<first))first=t; }); });
  const mins=L.finished&&first?Math.max(1,Math.round((L.finished-first)/60000)):null;
  const nxtW=d<5?w:(w<12?w+1:null), nxtD=d<5?d+1:1;
  const nxt=nxtW?dayAt(nxtW,nxtD):null;
  return `<div class="screen finish">
    <div class="big">✓</div>
    <h1>${esc(splitName(day.d)[0])} done</h1>
    <p>Week ${w}, day ${d}</p>
    <div class="sumgrid">
      <div><div class="v">${cnt}</div><div class="k">working sets</div></div>
      <div><div class="v">${mins!=null?mins:'–'}</div><div class="k">minutes</div></div>
      <div><div class="v">${vol?Math.round(vol/1000*10)/10+'k':'–'}</div><div class="k">volume ${S.unit}</div></div>
    </div>
    ${nxt?`<p style="color:var(--muted);font-size:14px">Up next: ${esc(splitName(nxt.d)[0])}, week ${nxtW} day ${nxtD}</p>`:`<p>That was the last session of the program.</p>`}
    <button class="btn primary" onclick="advanceAndHome()">${nxt?'Set up the next day':'Back to start'}</button>
    <button class="btn ghost" style="margin-top:10px" onclick="view='workout';render()">Back to the workout</button>
  </div>`;
}
function advanceAndHome(){ advance(); view='home'; render(); }

/* ===================== history ===================== */
let histSel=null, histName=null, histBack='home';
function openHistory(){ view='history'; render(); }
function openSession(w,d){ histSel={w,d}; view='session'; render(); }
function openExHist(name,back){ histName=name; histBack=back||'history'; view='exhist'; render(); }

function sessionRows(w,d){
  const L=S.log[key(w,d)], day=dayAt(w,d);
  if(!L||!day) return null;
  const out=[];
  day.e.forEach((ex,i)=>{
    const e=L.ex[i];
    const names=[ex.n,ex.s1,ex.s2].filter(Boolean);
    const row={name:(e&&names[e.sub])||ex.n, target:ex.ws+' x '+ex.r, wu:[], work:[], key:ex.n};
    if(e){
      for(let k=0;k<4;k++){ const r=e.sets['wu'+k]; if(r&&r.done) row.wu.push(r); }
      for(let k=0;k<(e.ws||ex.ws);k++){ const r=e.sets['w'+k]; if(r&&r.done) row.work.push(r); }
    }
    out.push(row);
  });
  return out;
}
function sessionSummary(w,d){
  const rows=sessionRows(w,d)||[]; let sets=0,vol=0,ex=0;
  rows.forEach(r=>{ if(r.work.length)ex++; r.work.forEach(x=>{ sets++; if(x.weight&&x.reps)vol+=conv(x.weight,setUnit(x),S.unit)*parseFloat(x.reps); }); });
  return {sets,vol,ex,rows};
}
function logKeys(){
  return Object.keys(S.log).map(k=>{ const m=k.match(/w(\d+)d(\d+)/); return m?{w:+m[1],d:+m[2],k}:null; })
    .filter(Boolean).sort((a,b)=>(b.w*10+b.d)-(a.w*10+a.d));
}
function fmtDate(t){ if(!t)return ''; const d=new Date(t); return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function best(rows,u){ let b=0; rows.forEach(r=>{ const v=conv(r.weight,setUnit(r),u||S.unit); if(v>b)b=v; }); return b; }

function historyHTML(){
  const items=logKeys();
  const body=items.length?items.map(it=>{
    const L=S.log[it.k], day=dayAt(it.w,it.d); if(!day) return '';
    const sm=sessionSummary(it.w,it.d);
    const miss=L.status==='skipped';
    return `<button class="hcard ${miss?'miss':''}" onclick="openSession(${it.w},${it.d})">
      <div class="hl"><span class="hn">${esc(splitName(day.d)[0])}</span><span class="hw">w${it.w} d${it.d}${L.finished||L.started?', '+fmtDate(L.finished||L.started):''}</span></div>
      <div class="hm">${miss?'Missed':(L.status==='done'?'Completed':'In progress')} &nbsp;·&nbsp; <b>${sm.sets}</b> sets${sm.vol?' &nbsp;·&nbsp; <b>'+Math.round(sm.vol)+'</b> '+S.unit+' volume':''}</div>
    </button>`;
  }).join(''):'<p style="color:var(--muted);font-size:15px">Nothing logged yet. Finish a session and it shows up here.</p>';
  return `<div class="screen"><div class="hhead"><button class="xbtn" onclick="view='home';render()">‹</button><h1>History</h1></div>
    ${body}
    ${items.length?'<p class="tiny" style="margin-top:14px">Tap a session to see every set. Tap an exercise inside it to see that lift over time.</p>':''}</div>`;
}

function sessionHTML(){
  const {w,d}=histSel, day=dayAt(w,d), L=S.log[key(w,d)];
  const sm=sessionSummary(w,d);
  return `<div class="screen"><div class="hhead"><button class="xbtn" onclick="view='history';render()">‹</button>
    <h1>${esc(splitName(day.d)[0])}<br><span style="font-size:13px;color:var(--muted);font-weight:400">Week ${w}, day ${d}${L.finished?', '+fmtDate(L.finished):''}</span></h1></div>
    <div class="sumgrid" style="margin-top:0">
      <div><div class="v">${sm.ex}</div><div class="k">exercises</div></div>
      <div><div class="v">${sm.sets}</div><div class="k">working sets</div></div>
      <div><div class="v">${sm.vol?Math.round(sm.vol/1000*10)/10+'k':'–'}</div><div class="k">volume ${S.unit}</div></div>
    </div>
    <div class="plist" style="padding:0 14px">
      ${sm.rows.map(r=>{
        const bu=exUnitOf(r.key), bw=best(r.work,bu);
        return `<div class="hex">
          <div class="hxn"><button style="text-align:left;flex:1;font:inherit" onclick="openExHist('${esc(r.key).replace(/'/g,"\\'")}','session')">${esc(r.name)}</button><small>target ${esc(r.target)}</small></div>
          ${(r.wu.length||r.work.length)?`<div class="sets">
            ${r.wu.map(x=>`<span class="sbox wu">${x.weight?esc(x.weight)+setUnit(x):'warm up'}${x.weight&&x.reps?' <i>x</i> '+esc(x.reps):''}</span>`).join('')}
            ${r.work.map(x=>`<span class="sbox ${bw&&conv(x.weight,setUnit(x),bu)===bw?'best':''}">${x.weight?esc(x.weight)+setUnit(x)+' ':''}${x.weight&&x.reps?'<i>x</i> '+esc(x.reps):(x.reps?esc(x.reps)+' reps':'done')}</span>`).join('')}
          </div>`:'<div class="hempty">Not logged</div>'}
        </div>`;}).join('')}
    </div>
    <button class="btn ghost" style="margin-top:16px" onclick="jumpTo(${w},${d});startWorkout()">Open this session again</button></div>`;
}

function exHistHTML(){
  const name=histName;
  const hits=[];
  logKeys().slice().reverse().forEach(it=>{
    const day=dayAt(it.w,it.d); if(!day)return;
    day.e.forEach((ex,i)=>{
      if(ex.n!==name)return;
      const e=S.log[it.k].ex&&S.log[it.k].ex[i]; if(!e)return;
      const rows=[]; for(let k=0;k<(e.ws||ex.ws);k++){ const r=e.sets['w'+k]; if(r&&r.done)rows.push(r); }
      if(rows.length)hits.push({w:it.w,d:it.d,rows,ts:S.log[it.k].finished,target:ex.ws+' x '+ex.r});
    });
  });
  const hu=exUnitOf(name);
  const tops=hits.map(h=>Math.round(best(h.rows,hu)*10)/10);
  const peak=Math.max.apply(null,tops.concat([0]));
  return `<div class="screen"><div class="hhead"><button class="xbtn" onclick="view='${histBack}';render()">‹</button><h1>${esc(name)}</h1></div>
    ${hits.length?`
      <div class="gridwrap">
        <div style="font-size:13px;color:var(--muted)">Top set each session, shown in ${hu}${peak?', best was <b class="num" style="color:var(--chalk)">'+peak+' '+hu+'</b>':''}</div>
        <div class="trendbar">${tops.map(t=>`<i class="${peak&&t===peak?'top':''}" style="height:${peak?Math.max(8,100*t/peak):8}%"></i>`).join('')}</div>
      </div>
      <div class="plist" style="padding:0 14px;margin-top:12px">
        ${hits.slice().reverse().map(h=>`<div class="prow">
          <span class="pw">w${h.w} d${h.d}</span>
          <span style="flex:1"><span class="sets" style="margin:0">${h.rows.map(x=>`<span class="sbox">${x.weight?esc(x.weight)+setUnit(x)+' ':''}${x.weight&&x.reps?'<i>x</i> '+esc(x.reps):(x.reps?esc(x.reps)+' reps':'done')}</span>`).join('')}</span></span>
        </div>`).join('')}
      </div>`
    :'<p style="color:var(--muted);font-size:15px">No sets logged for this exercise yet.</p>'}
  </div>`;
}

/* ===================== sheets ===================== */
function sheet(html){
  $('#modalhost').innerHTML=`<div class="modal" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`;
}
function closeSheet(){ $('#modalhost').innerHTML=''; }
function openJump(){
  sheet(`<h3>Go to another day</h3><p class="sub">Your logged sets stay where they are.</p>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Week</div>
    <div class="pickgrid">${Array.from({length:12},(_,i)=>`<button class="${S.week===i+1?'on':''}" onclick="pickW(${i+1})">${i+1}</button>`).join('')}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Day</div>
    <div class="pickgrid" style="grid-template-columns:repeat(5,1fr)">${Array.from({length:5},(_,i)=>`<button class="${S.day===i+1?'on':''}" onclick="pickD(${i+1})">${i+1}</button>`).join('')}</div>
    <div class="tiny" style="margin-bottom:14px">${esc(dayAt(S.week,S.day)?dayAt(S.week,S.day).d:'')}</div>
    <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
function pickW(w){ S.week=w; if(S.day>5)S.day=1; save(); render(); openJump(); }
function pickD(d){ S.day=d; save(); render(); openJump(); }

function openSettings(){
  sheet(`<h3>Settings</h3><p class="sub">Everything is stored on this phone only.</p>
    <div class="optrow"><span>Appearance</span><span class="seg">
      <button class="${(S.theme||'auto')==='auto'?'on':''}" onclick="setOpt('theme','auto')">Auto</button>
      <button class="${S.theme==='light'?'on':''}" onclick="setOpt('theme','light')">Light</button>
      <button class="${S.theme==='dark'?'on':''}" onclick="setOpt('theme','dark')">Dark</button></span></div>
    <div class="optrow"><span>Default unit for new exercises</span><span class="seg">
      <button class="${S.unit==='kg'?'on':''}" onclick="setOpt('unit','kg')">kg</button>
      <button class="${S.unit==='lb'?'on':''}" onclick="setOpt('unit','lb')">lb</button></span></div>
    <div class="optrow"><span>Round warm ups, kg</span><span class="seg">
      <button class="${S.round===1?'on':''}" onclick="setOpt('round',1)">1</button>
      <button class="${S.round===2.5?'on':''}" onclick="setOpt('round',2.5)">2.5</button>
      <button class="${S.round===5?'on':''}" onclick="setOpt('round',5)">5</button></span></div>
    <div class="optrow"><span>Round warm ups, lb</span><span class="seg">
      <button class="${S.roundLb===2.5?'on':''}" onclick="setOpt('roundLb',2.5)">2.5</button>
      <button class="${S.roundLb===5?'on':''}" onclick="setOpt('roundLb',5)">5</button>
      <button class="${S.roundLb===10?'on':''}" onclick="setOpt('roundLb',10)">10</button></span></div>
    <div class="optrow"><span>Beep when rest is up</span><button class="switch ${S.beep?'on':''}" onclick="setOpt('beep',${!S.beep})"><i></i></button></div>
    <div class="optrow"><span>Time warm up sets too</span><button class="switch ${S.wuTimer?'on':''}" onclick="setOpt('wuTimer',${!S.wuTimer})"><i></i></button></div>
    <div style="height:18px"></div>
    <button class="btn ghost" onclick="exportData()">Save a backup file</button>
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="$('#importer').click()">Restore from a backup</button>
    <input type="file" id="importer" accept="application/json" style="display:none" onchange="importData(this)">
    <div style="height:10px"></div>
    <button class="btn ghost" style="color:var(--redtext)" onclick="resetAll()">Erase all progress</button>
    <div class="tiny" style="margin-top:16px">iPhone can clear website data if you go months without opening this. Save a backup now and then.</div>
    <div style="height:14px"></div>
    <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
function setOpt(k,v){ S[k]=v; save(); applyTheme(); render(); openSettings(); }
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='transformation-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.log)throw 0; S=Object.assign({},defaults,o); save(); closeSheet(); view='home'; render(); }catch(e){ alert('That file is not a backup from this app.'); } };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('Erase every logged set and start at week 1 day 1?'))return;
  S=Object.assign({},defaults,{log:{}}); save(); closeSheet(); view='home'; render();
}

/* ===================== go ===================== */
applyTheme();
document.addEventListener('touchstart',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});
render();
</script>
</body>
</html>
